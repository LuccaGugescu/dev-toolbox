# Builds the Windows installer. On a version tag (v1.2.3) it is attached to a GitHub Release;
# on manual runs it is uploaded as a workflow artifact.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: DevToolbox-Setup
          path: dist/DevToolbox-Setup-*.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DevToolbox-Setup-*.exe
          generate_release_notes: true
